{% extends "base.html" %}

{% block title %}Parent Grades{% endblock %}

{% block content %}

<div class="p-6">

    <h1 class="text-2xl font-bold text-teal-700 mb-6">
        Select Grade
    </h1>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">

        {% for grade in grades %}
        <a href="{% url 'parents:parents_in_grade' grade.id %}"
           class="bg-white shadow rounded-lg p-6 hover:bg-teal-50">

            <h2 class="font-semibold text-lg text-teal-700">
                {{ grade.name }}
            </h2>

            <p class="text-sm text-gray-600">
                View parents in this grade
            </p>

        </a>
        {% endfor %}

    </div>

</div>

{% endblock %}
